<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#f5f7ff">
  <title>おんぷゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">

    <header>
      <h1>🎵 おんぷゲーム</h1>
      <p>おんぷを よんでみよう！</p>
    </header>

    <!-- メニュー -->
    <section id="menu" class="screen">

      <h2>どちらを れんしゅうする？</h2>

      <button class="clef-button treble" data-clef="treble">
        <span class="clef-symbol">𝄞</span>
        <span class="clef-name">ト音記号</span>
        <small>ド〜高いド</small>
      </button>

      <button class="clef-button bass" data-clef="bass">
        <span class="clef-symbol">𝄢</span>
        <span class="clef-name">ヘ音記号</span>
        <small>ド〜高いド</small>
      </button>

    </section>

    <!-- クイズ -->
    <section id="quiz" class="screen hidden">

      <div class="quiz-top">

        <button id="back-button" class="small-button">
          ← もどる
        </button>

        <div id="progress">1 / 10</div>

        <div id="score">
          ⭐ 0
        </div>

      </div>

      <div class="question-card">

        <div id="clef-title">
          ト音記号
        </div>

        <div class="staff-wrap">
          <svg
            id="staff"
            viewBox="0 0 600 260"
            preserveAspectRatio="xMidYMid meet"
            aria-label="五線譜"
          >
            <!-- 五線 -->
            <line x1="50" y1="80"  x2="550" y2="80"  class="staff-line"/>
            <line x1="50" y1="105" x2="550" y2="105" class="staff-line"/>
            <line x1="50" y1="130" x2="550" y2="130" class="staff-line"/>
            <line x1="50" y1="155" x2="550" y2="155" class="staff-line"/>
            <line x1="50" y1="180" x2="550" y2="180" class="staff-line"/>

            <!-- 音部記号 -->
            <text id="clef-symbol" x="70" y="160"></text>

            <!-- 音符 -->
            <g id="note-group">
              <ellipse id="note-head" cx="360" cy="130" rx="17" ry="12"></ellipse>
              <line id="note-stem" x1="376" y1="130" x2="376" y2="55"></line>
            </g>
          </svg>
        </div>

        <p class="question-label">
          この おとは なに？
        </p>

      </div>

      <div id="answers" class="answers"></div>

      <div
        id="message"
        class="message"
        aria-live="polite"
      ></div>

      <button
        id="next-button"
        class="next-button hidden"
      >
        つぎへ →
      </button>

    </section>

    <!-- 結果 -->
    <section id="result" class="screen hidden">

      <div class="result-card">

        <div class="result-icon">
          🎉
        </div>

        <h2>おつかれさま！</h2>

        <p id="result-text">
          10もん おわったよ！
        </p>

        <div id="result-score" class="result-score">
          10 / 10
        </div>

        <button
          id="again-button"
          class="main-button"
        >
          もういちど！
        </button>

        <button
          id="menu-button"
          class="secondary-button"
        >
          メニューへ
        </button>

      </div>

    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
