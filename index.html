<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#f5f7ff"
  >

  <title>おんぷゲーム</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <main class="app">


    <!-- =================================
         メニュー
    ================================== -->

    <section
      id="menu"
      class="screen"
    >

      <header>

        <h1>🎵 おんぷゲーム</h1>

        <p>
          おんぷを よんでみよう！
        </p>

      </header>


      <!-- =================================
           とおんきごう
      ================================== -->

      <h2>
        とおんきごう
      </h2>


      <!-- かんたん -->

      <button
        class="clef-button treble"
        data-clef="treble"
        data-level="easy"
      >

        <span class="clef-symbol">
          𝄞
        </span>

        <span class="clef-name">
          とおんきごう
        </span>

        <small>
          かんたん
        </small>

      </button>


      <!-- むずかしい -->

      <button
        class="clef-button treble"
        data-clef="treble"
        data-level="hard"
      >

        <span class="clef-symbol">
          𝄞
        </span>

        <span class="clef-name">
          とおんきごう
        </span>

        <small>
          むずかしい
        </small>

      </button>



      <!-- =================================
           へおんきごう
      ================================== -->

      <h2>
        へおんきごう
      </h2>


      <!-- かんたん -->

      <button
        class="clef-button bass"
        data-clef="bass"
        data-level="easy"
      >

        <span class="clef-symbol">
          𝄢
        </span>

        <span class="clef-name">
          へおんきごう
        </span>

        <small>
          かんたん
        </small>

      </button>


      <!-- むずかしい -->

      <button
        class="clef-button bass"
        data-clef="bass"
        data-level="hard"
      >

        <span class="clef-symbol">
          𝄢
        </span>

        <span class="clef-name">
          へおんきごう
        </span>

        <small>
          むずかしい
        </small>

      </button>

    </section>



    <!-- =================================
         クイズ
    ================================== -->

    <section
      id="quiz"
      class="screen hidden"
    >


      <!-- ---------------------------------
           上部
      ---------------------------------- -->

      <div class="quiz-top">


        <button
          id="back-button"
          class="small-button"
        >
          ← もどる
        </button>


        <div id="progress">
          1 / 8
        </div>


        <div id="score">
          ⭐ 0
        </div>

      </div>



      <!-- ---------------------------------
           問題カード
      ---------------------------------- -->

      <div class="question-card">


        <div id="clef-title">
          とおんきごう
        </div>


        <!-- =================================
             五線譜
        ================================== -->

        <div class="staff-wrap">

          <svg
            id="staff"
            viewBox="0 0 600 260"
            preserveAspectRatio="xMidYMid meet"
            aria-label="五線譜"
          >


            <!-- ---------------------------------
                 五線
            ---------------------------------- -->

            <line
              x1="50"
              y1="80"
              x2="550"
              y2="80"
              class="staff-line"
            />

            <line
              x1="50"
              y1="105"
              x2="550"
              y2="105"
              class="staff-line"
            />

            <line
              x1="50"
              y1="130"
              x2="550"
              y2="130"
              class="staff-line"
            />

            <line
              x1="50"
              y1="155"
              x2="550"
              y2="155"
              class="staff-line"
            />

            <line
              x1="50"
              y1="180"
              x2="550"
              y2="180"
              class="staff-line"
            />


            <!-- ---------------------------------
                 音部記号
            ---------------------------------- -->

            <text
              id="clef-symbol"
              x="70"
              y="160"
            ></text>


            <!-- ---------------------------------
                 音符
            ---------------------------------- -->

            <g id="note-group">


              <!--
                加線

                とおんきごう：
                低い「ど」

                へおんきごう：
                高い「ど」
              -->

              <line
                id="ledger-line"
                x1="335"
                y1="205"
                x2="385"
                y2="205"
                class="staff-line hidden"
              />


              <!-- 音符の頭 -->

              <ellipse
                id="note-head"
                cx="360"
                cy="130"
                rx="17"
                ry="12"
              ></ellipse>


              <!-- 音符の棒 -->

              <line
                id="note-stem"
                x1="376"
                y1="130"
                x2="376"
                y2="55"
              />

            </g>

          </svg>

        </div>


        <!-- ---------------------------------
             問題文
        ---------------------------------- -->

        <p class="question-label">
          この おとは なに？
        </p>


      </div>



      <!-- =================================
           回答ボタン
      ================================== -->

      <div
        id="answers"
        class="answers"
      ></div>



      <!-- =================================
           メッセージ
      ================================== -->

      <div
        id="message"
        class="message"
        aria-live="polite"
      ></div>



      <!-- =================================
           つぎへボタン
      ================================== -->

      <button
        id="next-button"
        class="next-button hidden"
      >
        つぎへ →
      </button>


    </section>



    <!-- =================================
         結果
    ================================== -->

    <section
      id="result"
      class="screen hidden"
    >

      <div class="result-card">


        <div class="result-icon">
          🎉
        </div>


        <h2>
          おつかれさま！
        </h2>


        <p id="result-text">
          がんばったね！
        </p>


        <div
          id="result-score"
          class="result-score"
        >
          0 / 8
        </div>


        <!-- ---------------------------------
             もう一度
        ---------------------------------- -->

        <button
          id="again-button"
          class="main-button"
        >
          もういちど！
        </button>


        <!-- ---------------------------------
             メニュー
        ---------------------------------- -->

        <button
          id="menu-button"
          class="secondary-button"
        >
          メニューへ
        </button>


      </div>

    </section>


  </main>


  <!-- =================================
       JavaScript
  ================================== -->

  <script src="app.js"></script>

</body>

</html>
