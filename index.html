<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>おんぷゲーム</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- =================================
         ヘッダー
    ================================== -->

    <header>
      <h1>🎵 おんぷゲーム</h1>

      <p>
        おんぷを よんでみよう！
      </p>
    </header>


    <!-- =================================
         メインメニュー
    ================================== -->

    <section
      id="menu"
      class="screen"
    >

      <h2>
        れんしゅうを えらんでね
      </h2>


      <!-- =================================
           とおんきごう
      ================================== -->

      <div class="clef-section">

        <h2>
          <span class="section-clef">𝄞</span>
          とおんきごう
        </h2>


        <div class="clef-buttons">

          <!-- かんたん -->

          <button
            class="clef-button"
            data-clef="treble"
            data-level="easy"
          >
            <span class="clef-level">
              かんたん
            </span>
          </button>


          <!-- むずかしい -->

          <button
            class="clef-button"
            data-clef="treble"
            data-level="hard"
          >
            <span class="clef-level">
              むずかしい
            </span>
          </button>

        </div>

      </div>


      <!-- =================================
           へおんきごう
      ================================== -->

      <div class="clef-section">

        <h2>
          <span class="section-clef">𝄢</span>
          へおんきごう
        </h2>


        <div class="clef-buttons">

          <!-- かんたん -->

          <button
            class="clef-button"
            data-clef="bass"
            data-level="easy"
          >
            <span class="clef-level">
              かんたん
            </span>
          </button>


          <!-- むずかしい -->

          <button
            class="clef-button"
            data-clef="bass"
            data-level="hard"
          >
            <span class="clef-level">
              むずかしい
            </span>
          </button>

        </div>

      </div>

    </section>


    <!-- =================================
         クイズ画面
    ================================== -->

    <section
      id="quiz"
      class="screen hidden"
    >

      <!-- クイズ上部 -->

      <div class="quiz-top">

        <button
          id="back-button"
          class="small-button"
          type="button"
        >
          ← もどる
        </button>


        <div id="progress">
          1 / 10
        </div>


        <div id="score">
          ⭐ 0
        </div>

      </div>


      <!-- =================================
           問題カード
      ================================== -->

      <div class="question-card">

        <div class="staff-wrap">

          <svg
            id="staff"
            viewBox="0 0 600 260"
            preserveAspectRatio="xMidYMid meet"
            aria-label="五線譜"
          >

            <!-- =================================
                 五線
            ================================== -->

            <line
              class="staff-line"
              x1="50"
              y1="80"
              x2="550"
              y2="80"
            />

            <line
              class="staff-line"
              x1="50"
              y1="105"
              x2="550"
              y2="105"
            />

            <line
              class="staff-line"
              x1="50"
              y1="130"
              x2="550"
              y2="130"
            />

            <line
              class="staff-line"
              x1="50"
              y1="155"
              x2="550"
              y2="155"
            />

            <line
              class="staff-line"
              x1="50"
              y1="180"
              x2="550"
              y2="180"
            />


            <!-- =================================
                 音部記号
            ================================== -->

            <text
              id="clef-symbol"
              x="70"
              y="160"
            ></text>


            <!-- =================================
                 音符
            ================================== -->

            <g id="note-group">

              <!-- 加線 -->

              <line
                id="ledger-line"
                class="staff-line hidden"
                x1="335"
                y1="205"
                x2="385"
                y2="205"
              />


              <!-- 音符のたま -->

              <ellipse
                id="note-head"
                cx="360"
                cy="130"
                rx="17"
                ry="12"
              ></ellipse>


              <!-- 音符のぼう -->

              <line
                id="note-stem"
                x1="376"
                y1="130"
                x2="376"
                y2="55"
              />

            </g>

          </svg>

        </div>


        <!-- =================================
             問題文
        ================================== -->

        <p class="question-label">
          この おとは なに？
        </p>

      </div>


      <!-- =================================
           回答
      ================================== -->

      <div
        id="answers"
        class="answers"
      ></div>


      <!-- =================================
           メッセージ
      ================================== -->

      <div
        id="message"
        class="message"
        aria-live="polite"
      ></div>


      <!-- =================================
           つぎへボタン
      ================================== -->

      <button
        id="next-button"
        class="next-button hidden"
        type="button"
      >
        つぎへ
      </button>

    </section>


    <!-- =================================
         結果画面
    ================================== -->

    <section
      id="result"
      class="screen hidden"
    >

      <div class="result-card">

        <div class="result-icon">
          🌟
        </div>


        <h2>
          おつかれさま！
        </h2>


        <div
          id="result-score"
          class="result-score"
        >
          0 / 10
        </div>


        <p id="result-text">
          よくできました！
        </p>


        <!-- もういちど -->

        <button
          id="again-button"
          class="main-button"
          type="button"
        >
          もういちど
        </button>


        <!-- メニューへ -->

        <button
          id="menu-button"
          class="secondary-button"
          type="button"
        >
          メニューへ
        </button>

      </div>

    </section>

  </div>


  <!-- =================================
       JavaScript
  ================================== -->

  <script src="app.js"></script>

</body>
</html>
